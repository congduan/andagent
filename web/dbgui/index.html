<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>数据库浏览器</title></head>
<body><div id="app">
  <header><button id="back" type="button" aria-label="返回" title="返回">←</button><div><strong id="title">数据库浏览器</strong><small id="mode"></small></div></header>
  <main><aside><h2>数据表</h2><div id="tables"></div></aside><section>
    <div class="toolbar"><h2 id="current">选择数据表</h2><div><button id="prev" type="button">上一页</button><span id="page">第 1 页</span><button id="next" type="button">下一页</button></div></div>
    <div id="grid"></div><p id="status" role="status"></p>
    <form id="query"><label for="sql">只读 SQL 查询</label><textarea id="sql" rows="3" placeholder="SELECT * FROM records LIMIT 100"></textarea><button type="submit">运行查询</button></form>
  </section></main>
  <dialog id="detail"><div class="detail-head"><strong>单元格内容</strong><button id="detail-close" type="button">关闭</button></div><pre id="detail-text"></pre></dialog>
</div><script type="module" src="./main.ts"></script></body></html>
